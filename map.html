<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WeatherGPT — Map</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>

  <!-- Real Leaflet Tiles -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            canvas: "#FAF9F4",
            "soft-blue-50": "#F0F9FF",
            "soft-blue": "#E0F2FE",
            accent: "#0284C7",
            "accent-dark": "#0369A1",
            sand: "#FAF5E6",
            primary: "#1E293B",
            muted: "#64748B"
          },
          fontFamily: {
            sans: ["Inter", "sans-serif"],
            display: ["Plus Jakarta Sans", "sans-serif"]
          }
        }
      }
    };
  </script>
</head>
<body class="bg-canvas text-primary font-sans antialiased h-screen flex flex-col overflow-hidden">

  <!-- Header -->
  <header class="w-full max-w-5xl mx-auto px-6 py-5 flex items-center justify-between shrink-0 z-20">
    <a href="index.html" class="flex items-center gap-2">
      <span class="w-2 h-2 rounded-full bg-accent inline-block"></span>
      <span class="font-display font-bold text-lg tracking-tight text-primary">WeatherGPT</span>
    </a>

    <nav class="hidden sm:flex items-center gap-6">
      <a href="index.html" class="text-sm font-medium text-muted hover:text-primary transition-colors">Home</a>
      <a href="assistant.html" class="text-sm font-medium text-muted hover:text-primary transition-colors">Assistant</a>
      <a href="map.html" class="text-sm font-medium text-accent">Map</a>
      <a href="insights.html" class="text-sm font-medium text-muted hover:text-primary transition-colors">Insights</a>
    </nav>

    <div class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-soft-blue text-xs font-medium text-accent">
      <span class="material-symbols-outlined text-[15px]">location_on</span>
      <span id="header-location">Locating…</span>
    </div>
  </header>

  <!-- Clean Full Map Surface -->
  <main class="flex-1 relative w-full overflow-hidden">
    
    <div id="real-map" class="w-full h-full z-0"></div>

    <!-- Centered Search Capsule -->
    <div class="absolute top-4 left-1/2 -translate-x-1/2 z-10 w-full max-w-md px-4">
      <div class="flex items-center bg-white/95 backdrop-blur rounded-2xl border border-soft-blue shadow-[0_4px_20px_rgba(2,132,199,0.06)] px-4 py-2.5">
        <span class="material-symbols-outlined text-[18px] text-accent mr-2">search</span>
        <input 
          type="text" 
          placeholder="Search location..." 
          class="bg-transparent text-xs text-primary outline-none w-full placeholder:text-muted"
        />
        <span id="current-temp-badge" class="text-[11px] font-medium text-accent bg-soft-blue px-2 py-0.5 rounded-full">—</span>
      </div>
    </div>

    <!-- Minimal Layer Pills -->
    <div class="absolute bottom-6 left-1/2 -translate-x-1/2 z-10">
      <div class="bg-white/95 backdrop-blur px-2 py-1.5 rounded-full border border-soft-blue shadow-[0_4px_20px_rgba(2,132,199,0.06)] flex items-center gap-1">
        <button class="px-3.5 py-1 rounded-full text-xs font-medium bg-accent text-white shadow-sm">
          Rainfall
        </button>
        <button class="px-3.5 py-1 rounded-full text-xs font-medium text-muted hover:text-primary transition-colors">
          Wind
        </button>
        <button class="px-3.5 py-1 rounded-full text-xs font-medium text-muted hover:text-primary transition-colors">
          Clouds
        </button>
      </div>
    </div>

  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    const API_BASE_URL = "https://weathergpt-77b2.onrender.com";
    // Render's free tier can take 30-50s to wake from a cold start — a
    // short timeout would misreport that as "server down".
    const FETCH_TIMEOUT_MS = 55000;

    // currentLocation is populated ONLY by GPS in this step.
    // queryLocation is declared for the future search step and MUST stay
    // null here — nothing in this file writes to it.
    let currentLocation = null; // { latitude, longitude, name }
    let queryLocation = null;

    let currentMarker = null;

    // Neutral India-wide view — never assume a specific city before GPS resolves.
    const map = L.map('real-map', { zoomControl: false }).setView([22.9734, 78.6569], 5);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
      maxZoom: 19
    }).addTo(map);

    function setHeaderLocation(text) {
      document.getElementById('header-location').textContent = text;
    }

    function setTempBadge(text) {
      document.getElementById('current-temp-badge').textContent = text;
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str == null ? '' : String(str);
      return div.innerHTML;
    }

    async function fetchWithTimeout(url) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), FETCH_TIMEOUT_MS);
      try {
        // TEMPORARY diagnostic logging (Phase 8 weather-failure diagnosis).
        // Logs only the request URL, response status, and response body —
        // never any API key, since none is ever present in frontend code.
        console.log('[WeatherGPT diag] Requesting:', url);
        const response = await fetch(url, { signal: controller.signal });
        console.log('[WeatherGPT diag] HTTP status:', response.status, 'for', url);
        if (!response.ok) {
          const bodyText = await response.text().catch(() => '(could not read body)');
          console.log('[WeatherGPT diag] Non-200 response body:', bodyText);
          throw new Error(`Server returned ${response.status}`);
        }
        const cloned = response.clone();
        try {
          return await response.json();
        } catch (parseErr) {
          const rawText = await cloned.text().catch(() => '(could not read body)');
          console.log('[WeatherGPT diag] JSON parse failed. Raw response body:', rawText);
          throw parseErr;
        }
      } catch (err) {
        console.log('[WeatherGPT diag] Fetch failed for', url, '— error:', err.message || err);
        if (err.name === 'AbortError') {
          throw new Error('The server took too long to respond (it may be waking up — try again shortly).');
        }
        throw new Error('Could not reach the WeatherGPT server.');
      } finally {
        clearTimeout(timer);
      }
    }

    function apiGet(path, params) {
      const url = new URL(API_BASE_URL + path);
      Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
      return fetchWithTimeout(url.toString());
    }

    // GET /location/reverse?lat=&lon= -> LocationResponse
    // { city, district, state, latitude, longitude, raw_display_name }
    function reverseGeocode(lat, lon) {
      return apiGet('/location/reverse', { lat, lon });
    }

    // GET /weather/current?lat=&lon= -> CurrentWeatherResponse
    // { latitude, longitude, temperature_c, feels_like_c, humidity_pct,
    //   wind_speed_ms, wind_deg, visibility_m, pressure_hpa, rain_1h_mm,
    //   condition_main, condition_description }
    function fetchCurrentWeather(lat, lon) {
      return apiGet('/weather/current', { lat, lon });
    }

    const currentLocationIcon = L.divIcon({
      className: 'custom-pin',
      html: `<div style="background-color: #0284C7; width: 14px; height: 14px; border-radius: 50%; border: 2.5px solid white; box-shadow: 0 2px 8px rgba(2,132,199,0.4);"></div>`,
      iconSize: [14, 14],
      iconAnchor: [7, 7]
    });

    // Builds popup HTML using ONLY fields confirmed to exist in
    // CurrentWeatherResponse — no fabricated observatory name, no
    // implied forecast time (this is a current-weather reading only).
    function buildPopupContent(locationName, weather) {
      const lines = [`<b>${escapeHtml(locationName)}</b>`];
      if (weather) {
        const temp = Math.round(weather.temperature_c);
        const feelsLike = Math.round(weather.feels_like_c);
        lines.push(`${temp}°C · ${escapeHtml(weather.condition_description)}`);
        lines.push(`Feels like ${feelsLike}°C`);
      } else {
        lines.push('<span style="color:#64748B">Weather unavailable</span>');
      }
      return lines.join('<br>');
    }

    function handleGeolocationError(error) {
      let message;
      switch (error.code) {
        case error.PERMISSION_DENIED:
          message = 'Location access was denied. Enable it in your browser settings to see your position.';
          break;
        case error.POSITION_UNAVAILABLE:
          message = 'Your location could not be determined right now.';
          break;
        case error.TIMEOUT:
          message = 'Getting your location took too long. Please try again.';
          break;
        default:
          message = 'Location unavailable.';
      }
      console.warn('Geolocation failed:', message);
      // No silent fallback to Lucknow — map stays at the neutral default view.
      //lol
      setHeaderLocation('Location unavailable');
      setTempBadge('N/A');
    }

    async function handleGeolocationSuccess(position) {
      const { latitude, longitude } = position.coords;

      currentLocation = { latitude, longitude, name: null };

      map.setView([latitude, longitude], 13);

      if (currentMarker) {
        map.removeLayer(currentMarker);
      }
      currentMarker = L.marker([latitude, longitude], { icon: currentLocationIcon })
        .addTo(map)
        .bindPopup(buildPopupContent('Current location', null))
        .openPopup();

      // Independent by design: one failing must not block the other.
      const [reverseResult, weatherResult] = await Promise.allSettled([
        reverseGeocode(latitude, longitude),
        fetchCurrentWeather(latitude, longitude),
      ]);

      let locationName = 'Current location';
      if (reverseResult.status === 'fulfilled') {
        const place = reverseResult.value;
        locationName = place.city
          ? `${place.city}${place.state ? ', ' + place.state : ''}`
          : 'Current location';
        currentLocation.name = locationName;
        setHeaderLocation(locationName);
      } else {
        console.warn('Reverse geocoding failed:', reverseResult.reason?.message);
        setHeaderLocation('Current location');
      }

      let weather = null;
      if (weatherResult.status === 'fulfilled') {
        weather = weatherResult.value;
        setTempBadge(`${Math.round(weather.temperature_c)}°`);
      } else {
        console.warn('Weather fetch failed:', weatherResult.reason?.message);
        setTempBadge('N/A');
      }

      currentMarker.setPopupContent(buildPopupContent(locationName, weather));
    }

    function requestCurrentLocation() {
      if (!('geolocation' in navigator)) {
        handleGeolocationError({ code: 0 });
        return;
      }
      navigator.geolocation.getCurrentPosition(
        handleGeolocationSuccess,
        handleGeolocationError,
        { enableHighAccuracy: false, timeout: 10000, maximumAge: 300000 }
      );
    }

    requestCurrentLocation();
  </script>
</body>
</html>
